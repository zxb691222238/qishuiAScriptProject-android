plugins { id 'com.android.application' }

def signingFile = rootProject.file('.private/signing.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'cn.qishui.helper'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.qishui.helper'
        minSdk 30
        targetSdk 35
       versionCode 5
        versionName '1.1.2'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
